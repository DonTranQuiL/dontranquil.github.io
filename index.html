    <style>
        /* Custom Keyframe Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        /* Radar Animation */
        @keyframes radar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .radar-sweep {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            margin-left: -100%;
            margin-top: -100%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(34, 211, 238, 0.15) 100%);
            animation: radar-spin 4s linear infinite;
            border-radius: 50%;
            pointer-events: none;
        }
        .radar-grid {
            background-image: 
                radial-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px),
                radial-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        /* AI Orb Pulse */
        @keyframes ai-pulse {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.5); opacity: 0.2; }
        }
        .ai-orb {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(168, 85, 247, 1), transparent 70%);
            border-radius: 50%;
            animation: ai-pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        /* Siren / Emergency Animation */
        @keyframes siren-flash {
            0%, 100% { background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.15), transparent 60%); }
            50% { background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 60%); }
        }
        .siren-bg {
            position: absolute;
            inset: 0;
            animation: siren-flash 2s infinite;
            pointer-events: none;
        }

        /* Seismograph Animation */
        @keyframes seismo-slide {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-seismo { animation: seismo-slide 3s linear infinite; }

        /* Realistic Thunderstorm & Rain */
        @keyframes thunder-flash {
            0%, 91%, 93%, 95%, 97%, 100% { opacity: 0; }
            92% { opacity: 0.8; background-color: rgba(255,255,255,1); }
            94% { opacity: 0.3; background-color: rgba(255,255,255,0.8); }
            96% { opacity: 0.9; background-color: #bae6fd; }
        }
        @keyframes rain-drop {
            0% { background-position: 0px 0px; }
            100% { background-position: -20px 200px; }
        }
        .thunder-overlay { animation: thunder-flash 7s infinite; }
        .rain-layer {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='200' viewBox='0 0 40 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,0 L15,30' stroke='rgba(255,255,255,0.3)' stroke-width='1.5' stroke-linecap='round' /%3E%3C/svg%3E");
            animation: rain-drop 0.6s linear infinite;
        }

        /* Broadcast Wave Animation */
        @keyframes broadcast {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }
        .animate-broadcast { animation: broadcast 2.5s infinite ease-out; }

        /* Battery Charging Animation */
        @keyframes charge-up {
            0% { height: 10%; opacity: 0.2; }
            50% { opacity: 0.5; }
            100% { height: 100%; opacity: 0.1; }
        }
        .animate-charge { animation: charge-up 3s ease-in-out infinite alternate; }

        /* News Ticker Animation */
        @keyframes news-ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-news { animation: news-ticker 20s linear infinite; }

        /* Slow Spin (Radiation / Washing Machine) */
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }

        /* Washing Machine Tumble & Slosh */
        @keyframes tumble {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes water-slosh {
            0%, 100% { transform: rotate(-5deg) translateY(0); }
            50% { transform: rotate(5deg) translateY(5px); }
        }
        .animate-tumble { animation: tumble 4s linear infinite; }
        .animate-water { animation: water-slosh 2s ease-in-out infinite; }

        /* Energy Market Chart Animation */
        @keyframes chart-scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-chart { animation: chart-scroll 6s linear infinite; }

        /* Realistic Traffic Highway */
        @keyframes traffic-dash {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes car-right {
            0% { left: -20%; }
            100% { left: 120%; }
        }
        @keyframes car-left {
            0% { right: -20%; }
            100% { right: 120%; }
        }
        .animate-traffic { animation: traffic-dash 2s linear infinite; }
        .animate-car-right { animation: car-right linear infinite; }
        .animate-car-left { animation: car-left linear infinite; }

        /* Floating Layers */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(var(--rot)); }
            50% { transform: translateY(-15px) rotate(var(--rot)); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
    </style>

        const { useState, useEffect } = React;

        // Dynamic Icon wrapper to use Lucide seamlessly in the browser
        const Icon = ({ name, size, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            
            useEffect(() => {
                if (window.lucide) {
                    const tempDiv = document.createElement('div');
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    tempDiv.appendChild(i);
                    window.lucide.createIcons({ root: tempDiv });
                    
                    const svgNode = tempDiv.querySelector('svg');
                    if (svgNode) {
                        if (className) {
                            const classes = className.split(' ');
                            classes.forEach(c => c && svgNode.classList.add(c));
                        }
                        if (size) {
                            svgNode.setAttribute('width', size);
                            svgNode.setAttribute('height', size);
                        }
                        setSvgHtml(svgNode.outerHTML);
                    }
                }
            }, [name, className, size]);

            return <span className="contents" dangerouslySetInnerHTML={{ __html: svgHtml }} />;
        };

            "entsoe_prijzen": {
                title: "ENTSO-E Power Prices",
                desc: "Daily day-ahead electricity prices (hourly rates) for all of Europe. The ultimate tool for dynamically scheduling heavy power loads.",
                icon: "globe",
                colorClass: "text-indigo-400 group-hover:text-indigo-300",
                bgHover: "group-hover:bg-indigo-500/20",
                borderHover: "hover:border-indigo-500/30",
                shadowHover: "hover:shadow-indigo-500/10",
                bgElement: <EnergyMarketAnimation color="text-indigo-400" fillClass="text-indigo-500/20" />
            },
            "HA-Animated-cards": {
                title: "Animated Lovelace Cards",
                desc: "Take your Home Assistant dashboard to the next level with dynamic, beautifully designed animated layer cards that bring your smart home to life.",
                icon: "layers",
                colorClass: "text-pink-400 group-hover:text-pink-300",
                bgHover: "group-hover:bg-pink-500/20",
                borderHover: "hover:border-pink-500/30",
                shadowHover: "hover:shadow-pink-500/10",
                bgElement: <LayersAnimation />
            },
            "ha-ndw-verkeer": {
                title: "NDW Traffic Analytics",
                desc: "Live traffic flow monitoring. Integrates the Dutch National Data Warehouse for Traffic Information (NDW) directly into Home Assistant.",
                icon: "car",
                colorClass: "text-slate-300 group-hover:text-white",
                bgHover: "group-hover:bg-slate-500/20",
                borderHover: "hover:border-slate-500/30",
                shadowHover: "hover:shadow-slate-500/10",
                bgElement: <TrafficAnimation />
            },
            "hass-pfsense-rewrite": {
                title: "pfSense Integration",
                desc: "Complete router and firewall monitoring. A robust, rewritten pfSense integration to track your network health within Home Assistant.",
                icon: "shield",
                colorClass: "text-red-400 group-hover:text-red-300",
                bgHover: "group-hover:bg-red-500/20",
                borderHover: "hover:border-red-500/30",
                shadowHover: "hover:shadow-red-500/10",
                bgElement: null
            },
            "L1-Weer-en-Nieuws": {
                title: "L1 Limburg News & Weather",
                desc: "Stay connected to your region. Brings live local L1 Limburg news headlines and weather reports straight to your dashboards.",
                icon: "newspaper",
                colorClass: "text-blue-300 group-hover:text-blue-200",
                bgHover: "group-hover:bg-blue-400/20",
                borderHover: "hover:border-blue-400/30",
                shadowHover: "hover:shadow-blue-400/10",
                bgElement: <NewsAnimation />
            },
            "smart-wardrobe": {
                title: "Smart Wardrobe",
                desc: "Stop running out of clean clothes. A proactive integration that monitors your schedule and alerts you when your laundry needs attention.",
                icon: "shirt",
                colorClass: "text-teal-400 group-hover:text-teal-300",
                bgHover: "group-hover:bg-teal-500/20",
                borderHover: "hover:border-teal-500/30",
                shadowHover: "hover:shadow-teal-500/10",
                bgElement: <WashingMachineAnimation />
            }
        };

        const getLanguageColor = (language) => {
            const colors = {
                Python: 'bg-blue-500',
                HTML: 'bg-orange-500',
                JavaScript: 'bg-yellow-400',
                TypeScript: 'bg-blue-600',
                CSS: 'bg-indigo-500',
            };
            return colors[language] || 'bg-slate-400';
        };

        const RepoCard = ({ repo, index }) => {
            const theme = integrationThemes[repo.name] || {
                title: repo.name.replace(/-/g, ' '),
                desc: repo.description || "Open source contribution.",
                icon: "code-2",
                colorClass: "text-slate-300 group-hover:text-white",
                bgHover: "group-hover:bg-slate-600/30",
                borderHover: "hover:border-slate-500/30",
                shadowHover: "hover:shadow-slate-500/10",
                bgElement: null
            };

            return (
                <div 
                    className={`animate-fade-in-up glass-card rounded-2xl flex flex-col h-full hover:-translate-y-2 transition-all duration-500 group border border-slate-700/50 ${theme.borderHover} ${theme.shadowHover}`}
                    style={{ animationDelay: `${index * 0.05}s` }}
                >
                    {theme.bgElement}

                    <div className="relative z-10 p-6 flex flex-col h-full">
                        <div className="flex items-start justify-between mb-4">
                            <div className="flex items-center space-x-4">
                                <div className={`p-3 bg-slate-800/80 rounded-xl transition-colors duration-300 ${theme.bgHover}`}>
                                    <Icon name={theme.icon} className={`w-7 h-7 transition-colors ${theme.colorClass}`} />
                                </div>
                                <h3 className={`text-xl font-bold transition-colors line-clamp-1 ${theme.colorClass}`}>
                                    {theme.title}
                                </h3>
                            </div>
                        </div>

                        <p className="text-slate-300 mb-6 flex-grow text-sm leading-relaxed drop-shadow-sm font-medium">
                            {theme.desc}
                        </p>

                        <div className="mt-auto pt-5 border-t border-slate-700/50 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center flex-wrap gap-2.5 text-xs font-bold text-slate-300">
                                {repo.language && (
                                    <div className="flex items-center bg-slate-800/80 px-2.5 py-1.5 rounded-md">
                                        <span className={`w-2 h-2 rounded-full mr-2 ${getLanguageColor(repo.language)}`}></span>
                                        {repo.language}
                                    </div>
                                )}
                                {(repo.stars > 0 || repo.forks > 0) && (
                                    <div className="flex items-center gap-3 bg-slate-800/80 px-2.5 py-1.5 rounded-md">
                                        {repo.stars > 0 && (
                                            <span className="flex items-center hover:text-yellow-400 transition-colors">
                                                <Icon name="star" className="w-3.5 h-3.5 mr-1 text-yellow-500" /> {repo.stars}
                                            </span>
                                        )}
                                        {repo.forks > 0 && (
                                            <span className="flex items-center hover:text-blue-400 transition-colors">
                                                <Icon name="git-fork" className="w-3.5 h-3.5 mr-1 text-blue-400" /> {repo.forks}
                                            </span>
                                        )}
                                    </div>
                                )}
                            </div>

                            <a
                                href={repo.html_url}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="inline-flex items-center justify-center whitespace-nowrap flex-shrink-0 w-full min-[400px]:w-auto px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-lg transition-colors duration-300 shadow-lg border border-slate-700"
                            >
                                View Code
                                <Icon name="external-link" className="w-4 h-4 ml-2 opacity-70" />
                            </a>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [mounted, setMounted] = useState(false);

            useEffect(() => {
                setMounted(true);
            }, []);

            const sortedRepos = [...reposData].sort((a, b) => 
                new Date(b.updated_at) - new Date(a.updated_at)
            );

            return (
                <div className="min-h-screen text-slate-200 font-sans selection:bg-cyan-500/30 overflow-x-hidden relative">
                    <div className="absolute top-0 left-1/4 w-96 h-96 bg-cyan-900/20 rounded-full blur-[120px] pointer-events-none"></div>
                    <div className="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-900/10 rounded-full blur-[120px] pointer-events-none"></div>

                    <header className="relative z-10 pt-24 pb-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
                        <div className="flex flex-col items-center text-center space-y-6">
                            <div className={`p-5 bg-slate-800/40 rounded-3xl border border-slate-700 backdrop-blur-xl transition-all duration-700 shadow-2xl ${mounted ? 'opacity-100 scale-100' : 'opacity-0 scale-90'}`}>
                                <Icon name="github" className="w-14 h-14 text-white" />
                            </div>
                            <div className={`space-y-5 max-w-3xl transition-all duration-700 delay-100 ${mounted ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-8'}`}>
                                <h1 className="text-5xl md:text-6xl font-extrabold tracking-tight text-white drop-shadow-lg">
                                    Engineering <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500">Automated</span> Homes
                                </h1>
                                <p className="text-lg md:text-xl text-slate-300 font-medium max-w-2xl mx-auto">
                                    High-performance custom integrations, open-source solutions, and advanced tools bridging the gap between hardware and Home Assistant.
                                </p>
                            </div>
                            
                            <div className={`flex items-center gap-4 pt-4 transition-all duration-700 delay-200 ${mounted ? 'opacity-100' : 'opacity-0'}`}>
                                <div className="flex items-center px-5 py-2.5 bg-slate-800/60 rounded-full border border-slate-700/50 text-sm font-bold shadow-inner">
                                    <Icon name="code-2" className="w-4 h-4 mr-2 text-cyan-400" />
                                    {sortedRepos.length} Projects Crafted
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 px-4 sm:px-6 lg:px-8 pb-32 max-w-7xl mx-auto">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                            {sortedRepos.map((repo, index) => (
                                <RepoCard key={repo.name} repo={repo} index={index} />
                            ))}
                        </div>
                    </main>
                    
                    <footer className="relative z-10 border-t border-slate-800/80 py-8 text-center text-slate-500 text-sm font-medium">
                        <p>© {new Date().getFullYear()} DonTranQuiL. Built for the Home Assistant Community.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
