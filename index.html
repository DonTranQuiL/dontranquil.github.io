<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonTranQuiL - Open Source Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .glass-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); position: relative; overflow: hidden; }
        
        @keyframes radar-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-sweep { position: absolute; top: 50%; left: 50%; width: 200%; height: 200%; margin-left: -100%; margin-top: -100%; background: conic-gradient(from 0deg, transparent 70%, rgba(34, 211, 238, 0.15) 100%); animation: radar-spin 4s linear infinite; border-radius: 50%; pointer-events: none; }
        .radar-grid { background-image: radial-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px), radial-gradient(rgba(34, 211, 238, 0.1) 1px, transparent 1px); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
        @keyframes ai-pulse { 0%, 100% { transform: scale(1); opacity: 0.1; } 50% { transform: scale(1.5); opacity: 0.2; } }
        .ai-orb { position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: radial-gradient(circle, rgba(168, 85, 247, 1), transparent 70%); border-radius: 50%; animation: ai-pulse 4s ease-in-out infinite; pointer-events: none; }
        @keyframes siren-flash { 0%, 100% { background: radial-gradient(circle at top right, rgba(239, 68, 68, 0.15), transparent 60%); } 50% { background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 60%); } }
        .siren-bg { position: absolute; inset: 0; animation: siren-flash 2s infinite; pointer-events: none; }
        @keyframes seismo-slide { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-seismo { animation: seismo-slide 3s linear infinite; }
        @keyframes thunder-flash { 0%, 91%, 93%, 95%, 97%, 100% { opacity: 0; } 92% { opacity: 0.8; background-color: rgba(255,255,255,1); } 94% { opacity: 0.3; background-color: rgba(255,255,255,0.8); } 96% { opacity: 0.9; background-color: #bae6fd; } }
        @keyframes rain-drop { 0% { background-position: 0px 0px; } 100% { background-position: -20px 200px; } }
        .thunder-overlay { animation: thunder-flash 7s infinite; }
        .rain-layer { background-image: url("data:image/svg+xml,%3Csvg width='40' height='200' viewBox='0 0 40 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20,0 L15,30' stroke='rgba(255,255,255,0.3)' stroke-width='1.5' stroke-linecap='round' /%3E%3C/svg%3E"); animation: rain-drop 0.6s linear infinite; }
        @keyframes broadcast { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(3); opacity: 0; } }
        .animate-broadcast { animation: broadcast 2.5s infinite ease-out; }
        @keyframes charge-up { 0% { height: 10%; opacity: 0.2; } 50% { opacity: 0.5; } 100% { height: 100%; opacity: 0.1; } }
        .animate-charge { animation: charge-up 3s ease-in-out infinite alternate; }
        @keyframes news-ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-news { animation: news-ticker 20s linear infinite; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 8s linear infinite; }
        @keyframes tumble { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes water-slosh { 0%, 100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(5px); } }
        .animate-tumble { animation: tumble 4s linear infinite; }
        .animate-water { animation: water-slosh 2s ease-in-out infinite; }
        @keyframes chart-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .animate-chart { animation: chart-scroll 6s linear infinite; }
        @keyframes traffic-dash { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes car-right { 0% { left: -20%; } 100% { left: 120%; } }
        @keyframes car-left { 0% { right: -20%; } 100% { right: 120%; } }
        .animate-traffic { animation: traffic-dash 2s linear infinite; }
        .animate-car-right { animation: car-right linear infinite; }
        .animate-car-left { animation: car-left linear infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(var(--rot)); } 50% { transform: translateY(-15px) rotate(var(--rot)); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        @keyframes scanline { 0%, 100% { top: 5%; opacity: 0.5; } 50% { top: 95%; opacity: 1; } }
        .animate-scan { animation: scanline 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-[#090e17]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Icon = ({ name, size, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const tempDiv = document.createElement('div');
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    tempDiv.appendChild(i);
                    window.lucide.createIcons({ root: tempDiv });
                    const svgNode = tempDiv.querySelector('svg');
                    if (svgNode) {
                        if (className) className.split(' ').forEach(c => c && svgNode.classList.add(c));
                        if (size) { svgNode.setAttribute('width', size); svgNode.setAttribute('height', size); }
                        setSvgHtml(svgNode.outerHTML);
                    }
                }
            }, [name, className, size]);
            return <span className="contents" dangerouslySetInnerHTML={{ __html: svgHtml }} />;
        };

        const SeismoAnimation = ({ color }) => <div className="absolute inset-0 overflow-hidden pointer-events-none opacity-40 z-0 flex items-center"><svg className="animate-seismo w-[200%] h-32" preserveAspectRatio="none" viewBox="0 0 200 20"><path d="M0,10 L10,10 L12,2 L14,18 L16,5 L18,15 L20,10 L100,10 L110,10 L112,2 L114,18 L116,5 L118,15 L120,10 L200,10" fill="none" stroke={color} strokeWidth="0.8" /></svg></div>;
        const LightningAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 rounded-2xl"><div className="absolute -inset-10 rain-layer opacity-60"></div><div className="absolute inset-0 thunder-overlay mix-blend-overlay"></div></div>;
        const BroadcastAnimation = () => <div className="absolute -bottom-8 -right-8 w-64 h-64 overflow-hidden pointer-events-none z-0 flex items-center justify-center"><div className="absolute w-12 h-12 border-2 border-blue-400/40 rounded-full animate-broadcast"></div><div className="absolute w-24 h-24 border-2 border-blue-400/30 rounded-full animate-broadcast" style={{ animationDelay: '0.8s' }}></div><div className="absolute w-36 h-36 border-2 border-blue-400/20 rounded-full animate-broadcast" style={{ animationDelay: '1.6s' }}></div></div>;
        const BatteryAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex items-end"><div className="w-full bg-gradient-to-t from-green-500/40 to-green-500/5 animate-charge origin-bottom"></div></div>;
        const NewsAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex flex-col justify-between p-4"><div className="flex justify-end items-center gap-2"><span className="animate-ping inline-flex h-3 w-3 rounded-full bg-red-400 opacity-75"></span></div><div className="w-full overflow-hidden opacity-10 font-mono text-xl whitespace-nowrap mb-2"><div className="animate-news">BREAKING NEWS • LOCAL UPDATES • WEATHER ALERT • REGIONAL NOTICES •</div></div></div>;
        const RadiationAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex items-center justify-center"><div className="absolute w-full h-full bg-lime-500/5 animate-pulse"></div><Icon name="radiation" size={160} className="text-lime-500/10 animate-spin-slow" /></div>;
        const WashingMachineAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex items-center justify-center opacity-20"><div className="relative w-32 h-32 border-8 border-teal-500/40 rounded-full flex items-center justify-center overflow-hidden bg-slate-900/50"><div className="absolute w-[150%] h-[150%] animate-tumble flex items-center justify-center"><div className="w-16 h-16 bg-teal-400/50 rounded-t-full -rotate-45 blur-sm"></div></div><div className="absolute bottom-0 w-full h-2/5 bg-teal-500/40 animate-water"></div></div></div>;
        const EnergyMarketAnimation = ({ color, fillClass }) => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 opacity-20 flex items-end"><div className="w-[200%] h-24 animate-chart flex items-end"><svg className="w-full h-full" preserveAspectRatio="none" viewBox="0 0 200 100"><path d="M0,100 L0,60 L20,40 L40,70 L60,30 L80,50 L100,20 L100,100 Z" fill="currentColor" className={fillClass} /><path d="M100,100 L100,20 L120,40 L140,70 L160,30 L180,50 L200,20 L200,100 Z" fill="currentColor" className={fillClass} /></svg></div></div>;
        const TrafficAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex items-center justify-center opacity-50"><div className="w-full h-16 bg-slate-900/60 border-y border-slate-700/80 flex flex-col justify-center relative"><div className="w-[200%] h-0 border-b-[1.5px] border-dashed border-slate-400/50 animate-traffic"></div><div className="absolute top-1.5 w-8 h-1 bg-red-500 animate-car-right"></div><div className="absolute bottom-1.5 w-10 h-1 bg-yellow-100 animate-car-left"></div></div></div>;
        const LayersAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex items-center justify-center opacity-20"><div className="absolute w-24 h-24 border-2 border-pink-500/50 rounded-xl animate-float"></div></div>;
        const BarcodeScannerAnimation = () => <div className="absolute inset-0 overflow-hidden pointer-events-none z-0 flex items-center justify-center opacity-20"><div className="relative w-32 h-24 flex gap-1.5 items-center justify-center bg-emerald-900/20 p-2 rounded-lg"><div className="absolute left-0 right-0 h-1 bg-red-500 animate-scan rounded-full"></div></div></div>;

        const reposData = [
            { "name": "grocy-pro", "html_url": "https://dontranquil.github.io/grocy-pro/", "language": "TypeScript" },
            { "name": "DOT-NL Chargers", "html_url": "https://dontranquil.github.io/DOT-NL-Chargers-for-Home-Assistant", "language": "Python" },
            { "name": "NPR Parkeren", "html_url": "https://dontranquil.github.io/NPR-Parkeren-for-Home-Assistant", "language": "Python" },
            { "name": "FlightRadar Fusion", "html_url": "https://dontranquil.github.io/ADSB-For-Home-assistant", "language": "Python" },
            { "name": "Global-Earthquake-Tracker-for-Home-Assistant", "html_url": "https://dontranquil.github.io/Global-Earthquake-Tracker-for-Home-Assistant", "language": "Python" },
            { "name": "knmi_seismisch", "html_url": "https://github.com/DonTranQuiL/knmi_seismisch", "language": "Python" },
            { "name": "Nova-Conversation", "html_url": "https://github.com/DonTranQuiL/Nova-Conversation", "language": "Python" },
            { "name": "virtual-battery-controller", "html_url": "https://github.com/DonTranQuiL/virtual-battery-controller", "language": "Python" },
            { "name": "ha-p2000", "html_url": "https://github.com/DonTranQuiL/ha-p2000", "language": "Python" },
            { "name": "HA-Weerplaza", "html_url": "https://github.com/DonTranQuiL/HA-Weerplaza", "language": "HTML" },
            { "name": "HA-Radmon", "html_url": "https://github.com/DonTranQuiL/HA-Radmon", "language": "Python" },
            { "name": "Bekendmakingen", "html_url": "https://github.com/DonTranQuiL/Bekendmakingen", "language": "Python" },
            { "name": "Enever_prijzen", "html_url": "https://github.com/DonTranQuiL/Enever_prijzen", "language": "Python" },
            { "name": "entsoe_prijzen", "html_url": "https://github.com/DonTranQuiL/entsoe_prijzen", "language": "Python" },
            { "name": "HA-Animated-cards", "html_url": "https://github.com/DonTranQuiL/HA-Animated-cards", "language": null },
            { "name": "ha-ndw-verkeer", "html_url": "https://github.com/DonTranQuiL/ha-ndw-verkeer", "language": "Python" },
            { "name": "hass-pfsense-rewrite", "html_url": "https://github.com/DonTranQuiL/hass-pfsense-rewrite", "language": null },
            { "name": "L1-Weer-en-Nieuws", "html_url": "https://github.com/DonTranQuiL/L1-Weer-en-Nieuws", "language": "Python" },
            { "name": "smart-wardrobe", "html_url": "https://github.com/DonTranQuiL/smart-wardrobe", "language": "Python" }
        ];

        const integrationThemes = {
            "grocy-pro": { title: "Grocy Pro", desc: "The ultimate, zero-latency, AI-powered inventory engine for Home Assistant.", icon: "shopping-cart", colorClass: "text-emerald-400", bgElement: <BarcodeScannerAnimation /> },
            "DOT-NL Chargers": { title: "DOT-NL Chargers", desc: "Dutch public EV chargers: occupancy, tariffs, and capped map pins.", icon: "plug-zap", colorClass: "text-emerald-400", bgElement: <BatteryAnimation /> },
            "NPR Parkeren": { title: "NPR Parkeren", desc: "Dutch municipal parking zones, live NPR tariffs and max stay, plus gazette traffic decisions.", icon: "map-pin", colorClass: "text-sky-400", bgElement: <TrafficAnimation /> },
            "FlightRadar Fusion": { title: "FlightRadar Fusion", desc: "High-performance hybrid ADS-B & FlightRadar24 monitor.", icon: "plane", colorClass: "text-cyan-400", bgElement: <div className="absolute inset-0 z-0 opacity-20 radar-grid"><div className="radar-sweep"></div></div> },
            "Global-Earthquake-Tracker-for-Home-Assistant": { title: "Global Earthquake Tracker", desc: "Real-time global earthquake monitoring and automated alerts.", icon: "activity", colorClass: "text-orange-500", bgElement: <SeismoAnimation color="#f97316" /> },
            "knmi_seismisch": { title: "KNMI Seismic Monitor", desc: "Dedicated Dutch earthquake detector.", icon: "activity", colorClass: "text-orange-400", bgElement: <SeismoAnimation color="#fb923c" /> },
            "Nova-Conversation": { title: "Nova Conversation", desc: "Blazing-fast OpenAI bridge for Home Assistant.", icon: "bot", colorClass: "text-purple-400", bgElement: <div className="ai-orb"></div> },
            "virtual-battery-controller": { title: "Virtual Battery", desc: "Turn your infrastructure into a highly efficient Virtual Battery.", icon: "battery-charging", colorClass: "text-green-400", bgElement: <BatteryAnimation /> },
            "ha-p2000": { title: "P2000 Emergency", desc: "Live emergency dispatch messages from Dutch emergency services.", icon: "siren", colorClass: "text-red-500", bgElement: <div className="siren-bg"></div> },
            "HA-Weerplaza": { title: "Weerplaza Weather", desc: "Comprehensive weather data with live lightning alerts.", icon: "cloud-lightning", colorClass: "text-yellow-400", bgElement: <LightningAnimation /> },
            "HA-Radmon": { title: "Radmon Radiation", desc: "Real-time monitoring of local background radiation.", icon: "radio-tower", colorClass: "text-lime-500", bgElement: <RadiationAnimation /> },
            "Bekendmakingen": { title: "Municipality Announcements", desc: "Automated local permit and roadwork updates.", icon: "megaphone", colorClass: "text-blue-400", bgElement: <BroadcastAnimation /> },
            "Enever_prijzen": { title: "Enever Energy", desc: "Daily market data for Gas and Electricity prices.", icon: "zap", colorClass: "text-yellow-500", bgElement: <EnergyMarketAnimation color="text-yellow-500" fillClass="text-yellow-500/20" /> },
            "entsoe_prijzen": { title: "ENTSO-E Prices", desc: "Day-ahead electricity prices for all of Europe.", icon: "globe", colorClass: "text-indigo-400", bgElement: <EnergyMarketAnimation color="text-indigo-400" fillClass="text-indigo-500/20" /> },
            "HA-Animated-cards": { title: "Animated Cards", desc: "Take your dashboard to the next level with dynamic designs.", icon: "layers", colorClass: "text-pink-400", bgElement: <LayersAnimation /> },
            "ha-ndw-verkeer": { title: "NDW Traffic", desc: "Live traffic flow monitoring.", icon: "car", colorClass: "text-slate-300", bgElement: <TrafficAnimation /> },
            "hass-pfsense-rewrite": { title: "pfSense Integration", desc: "Complete router and firewall monitoring.", icon: "shield", colorClass: "text-red-400", bgElement: null },
            "L1-Weer-en-Nieuws": { title: "L1 Limburg News", desc: "Brings live local news and weather reports.", icon: "newspaper", colorClass: "text-blue-300", bgElement: <NewsAnimation /> },
            "smart-wardrobe": { title: "Smart Wardrobe", desc: "Monitor laundry needs.", icon: "shirt", colorClass: "text-teal-400", bgElement: <WashingMachineAnimation /> }
        };

        const getLanguageColor = (language) => {
            const colors = { Python: 'bg-blue-500', HTML: 'bg-orange-500', TypeScript: 'bg-blue-600' };
            return colors[language] || 'bg-slate-400';
        };

        const RepoCard = ({ repo, index, onDragStart, onDragOver, onDrop }) => {
            const theme = integrationThemes[repo.name] || { title: repo.name, desc: "Open source project.", icon: "code-2", colorClass: "text-slate-300", bgElement: null };
            const slug = repo.html_url.split('/').pop();
            const badgeUrl = `https://img.shields.io/github/v/release/DonTranQuiL/${slug}?style=for-the-badge&color=007ec6`;

            return (
                <div draggable onDragStart={(e) => onDragStart(e, index)} onDragOver={(e) => onDragOver(e, index)} onDrop={(e) => onDrop(e, index)} className="animate-fade-in-up glass-card rounded-2xl flex flex-col h-full hover:-translate-y-2 transition-all border border-slate-700/50">
                    {theme.bgElement}
                    <div className="relative z-10 p-6 flex flex-col h-full">
                        <div className="flex items-center space-x-4 mb-4"><div className="p-3 bg-slate-800/80 rounded-xl"><Icon name={theme.icon} className={`w-7 h-7 ${theme.colorClass}`} /></div><h3 className={`text-xl font-bold ${theme.colorClass}`}>{theme.title}</h3></div>
                        <p className="text-slate-300 mb-6 flex-grow text-sm font-medium">{theme.desc}</p>
                        <div className="mt-auto pt-5 border-t border-slate-700/50 flex flex-wrap items-center justify-between gap-4">
                            <img src={badgeUrl} alt="Version" className="h-7" onError={(e) => e.target.style.display = 'none'} />
                            <a href={repo.html_url} target="_blank" className="whitespace-nowrap px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white text-sm font-bold rounded-lg border border-slate-700 flex items-center">View Code <Icon name="external-link" className="w-4 h-4 ml-2" /></a>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [orderedRepos, setOrderedRepos] = useState(reposData);
            const [dragIndex, setDragIndex] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('repoOrder');
                if (!saved) return;
                try {
                    const parsed = JSON.parse(saved);
                    const known = new Set(parsed.map((repo) => repo.name));
                    const missing = reposData.filter((repo) => !known.has(repo.name));
                    setOrderedRepos([...missing, ...parsed]);
                } catch (err) {
                    setOrderedRepos(reposData);
                }
            }, []);

            const handleDrop = (e, index) => {
                const newRepos = [...orderedRepos];
                const dragged = newRepos[dragIndex];
                newRepos.splice(dragIndex, 1);
                newRepos.splice(index, 0, dragged);
                setOrderedRepos(newRepos);
                localStorage.setItem('repoOrder', JSON.stringify(newRepos));
            };

            return (
                <div className="min-h-screen text-slate-200 font-sans p-4 md:p-8">
                    <header className="max-w-7xl mx-auto py-12 text-center">
                        <h1 className="text-5xl font-extrabold text-white mb-4">DonTranQuiL Portfolio</h1>
                        <p className="text-slate-400">Drag and drop to rearrange your integrations.</p>
                    </header>
                    <main className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {orderedRepos.map((repo, i) => <RepoCard key={repo.name} repo={repo} index={i} onDragStart={(e, idx) => setDragIndex(idx)} onDragOver={(e) => e.preventDefault()} onDrop={(e, idx) => handleDrop(e, idx)} />)}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
